# ============================================
# SyncHunt - Configuration
# ============================================
# Every section maps to a phase in main.py. Profiles select which phases run;
# the per-tool blocks control how.

general:
  profile: "balanced"            # quick | balanced | full | deep
  threads: 50                    # worker threads for built-in probers
  timeout: 30                    # per-tool / per-request timeout (seconds)
  rate_limit: 50                 # HTTP requests per second (shared token bucket)
  resolve_timeout: 5             # DNS timeout (seconds)
  retry: 2                       # HTTP retries
  user_agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/127.0.0.0 Safari/537.36"
  verbose: true
  output_dir: "output"
  scope_file: ""                 # file of in-scope entries
  out_of_scope_file: ""          # file of excluded entries

# ------------------------------------------------------------------
# Profiles select phases. Phase names must exist in main.py PHASES.
# ------------------------------------------------------------------
profiles:
  quick:
    phases:
      - subdomain
      - validation
      - enrichment
      - report
  balanced:
    phases:
      - subdomain
      - validation
      - enrichment
      - portscan
      - fingerprint
      - content
      - api_discovery
      - jsanalysis
      - vulnscan
      - prioritize
      - report
  full:
    phases:
      - subdomain
      - validation
      - enrichment
      - portscan
      - fingerprint
      - github_recon
      - content
      - api_discovery
      - jsanalysis
      - cloud_enum
      - vulnscan
      - sensitive
      - prioritize
      - report
  deep:
    phases:
      - subdomain
      - validation
      - enrichment
      - portscan
      - fingerprint
      - github_recon
      - content
      - api_discovery
      - jsanalysis
      - cloud_enum
      - vulnscan
      - sensitive
      - screenshot
      - prioritize
      - report

# ------------------------------------------------------------------
# Scope enforcement (in addition to --scope-file / --out-of-scope-file)
# ------------------------------------------------------------------
scope:
  include: []                    # e.g. ["example.com", "*.example.com", "10.0.0.0/24"]
  exclude: []                    # e.g. ["blog.example.com", "internal.example.com"]
  strict: false                  # true = require an explicit include rule

# ------------------------------------------------------------------
# Phase 1 - Subdomain enumeration
# ------------------------------------------------------------------
subdomain_enum:
  enabled: true
  subfinder:
    enabled: true
    threads: 30
    timeout: 30
    sources: "all"
    config: ""
  amass:
    enabled: true
    timeout: 30
    passive: true
    config: ""
  assetfinder:
    enabled: true
    subs_only: true
  findomain:
    enabled: true
  crtsh:
    enabled: true
  sublist3r:
    enabled: true
    threads: 30
  puredns:
    enabled: true
    wordlist: "wordlists/subdomains.txt"
    resolvers: "wordlists/resolvers.txt"
  gotator:
    enabled: true
    permutations: "wordlists/permutations.txt"
    depth: 1

# ------------------------------------------------------------------
# Phase 2 - Validation
# ------------------------------------------------------------------
subdomain_validation:
  enabled: true
  httpx:
    enabled: true
    threads: 50
    timeout: 10
    follow_redirects: true
  dnsx:
    enabled: true
    threads: 100

# ------------------------------------------------------------------
# Phase 3 - Asset enrichment
# ------------------------------------------------------------------
asset_enrichment:
  enabled: true
  max_hosts: 150
  probe_admin_paths: true
  report_header_issues: true
  admin_paths:
    - "/admin"
    - "/admin/login"
    - "/login"
    - "/wp-admin"
    - "/wp-login.php"
    - "/manager/html"
    - "/phpmyadmin"
    - "/.git/config"
    - "/.env"
    - "/server-status"
    - "/actuator/env"
    - "/metrics"
    - "/console"
    - "/debug"

# ------------------------------------------------------------------
# Phase 4 - Port scanning
# ------------------------------------------------------------------
port_scanning:
  enabled: true
  naabu:
    enabled: true
    top_ports: 1000
    rate: 5000
    threads: 25
    scan_type: "s"               # "s" needs root; SyncHunt retries with "c"
  nmap:
    enabled: true
    scan_type: "-sV -sC"
    top_ports: 100
    timing: "T4"
  masscan:
    enabled: false
    allow_root: false            # SyncHunt never calls sudo itself
    rate: 10000
    ports: "1-65535"

# ------------------------------------------------------------------
# Phase 5 - Fingerprinting
# ------------------------------------------------------------------
fingerprinting:
  enabled: true
  whatweb:
    enabled: true
    aggression: 3
  wafw00f:
    enabled: true
  webanalyze:
    enabled: true

# ------------------------------------------------------------------
# Phase 6 - GitHub reconnaissance
# ------------------------------------------------------------------
github_recon:
  enabled: true
  token: ""                      # or export GITHUB_TOKEN
  org: ""                        # optional organisation name
  max_repos: 10
  max_issues: 10
  max_pages: 2
  search_code: true              # requires a token
  dorks:
    - "password"
    - "secret"
    - "api_key"
    - "apikey"
    - "access_token"
    - "auth_token"
    - "credentials"
    - "db_password"
    - "private_key"
    - "BEGIN RSA PRIVATE KEY"

# ------------------------------------------------------------------
# Phase 7 - Content discovery
# ------------------------------------------------------------------
content_discovery:
  enabled: true
  waybackurls:
    enabled: true
  gau:
    enabled: true
    threads: 5
    providers: "wayback,commoncrawl,otx,urlscan"
  katana:
    enabled: true
    depth: 3
    threads: 20
    js_crawl: true
  gospider:
    enabled: true
    depth: 3
    threads: 10
  hakrawler:
    enabled: true
    depth: 3
  paramspider:
    enabled: true
  dirsearch:
    enabled: true
    wordlist: "wordlists/directories.txt"
    threads: 30
    extensions: "php,asp,aspx,jsp,html,js,json,xml,txt,bak,old,conf,config,env,yml,yaml,sql,log"
  feroxbuster:
    enabled: true
    wordlist: "wordlists/directories.txt"
    threads: 50
    depth: 2
  ffuf:
    enabled: true
    wordlist: "wordlists/directories.txt"
    threads: 40
    extensions: "php,asp,html,js,json,txt"
  x8:
    enabled: true
    wordlist: "wordlists/parameters.txt"
    threads: 20

# ------------------------------------------------------------------
# Phase 8 - API discovery
# ------------------------------------------------------------------
api_introspection:
  enabled: true
  max_hosts: 100
  graphql: true
  actuator: true
  report_health: false           # /health,/metrics,/status are recorded as assets only

# ------------------------------------------------------------------
# Phase 9 - JavaScript analysis
# ------------------------------------------------------------------
js_analysis:
  enabled: true
  max_files: 200
  check_sourcemaps: true
  linkfinder:
    enabled: true
  secretfinder:
    enabled: true
  # Extra regex patterns merged with the built-in library (core/secrets.py).
  # Built-in patterns already cover AWS/GCP/Slack/Stripe/JWT/private keys/etc.
  custom_regex:
    enabled: true
    patterns:
      - name: "Mailgun API Key"
        regex: "\\bkey-[0-9a-zA-Z]{32}\\b"
        severity: "high"
        confidence: "medium"
        entropy: false
      - name: "Firebase URL"
        regex: "https://[a-z0-9-]+\\.firebaseio\\.com"
        severity: "low"
        confidence: "high"
        entropy: false
      - name: "Internal Hostname"
        regex: "\\b[a-z0-9-]+\\.(?:internal|corp|local|intranet)\\b"
        severity: "low"
        confidence: "low"
        entropy: false

# ------------------------------------------------------------------
# Phase 10 - Cloud storage enumeration
# ------------------------------------------------------------------
cloud_enum:
  enabled: true
  aws: true
  azure: true
  gcp: true
  max_candidates: 120

# ------------------------------------------------------------------
# Phase 11 - Vulnerability scanning
# ------------------------------------------------------------------
vuln_scanning:
  enabled: true
  nuclei:
    enabled: true
    templates: ""
    severity: "critical,high,medium,low,info"
    rate_limit: 150
    bulk_size: 25
    concurrency: 25
    headless: false
    automatic_scan: true
    new_templates: false         # -nt updates templates over the network
  nikto:
    enabled: true
    tuning: "1234567890"
  dalfox:
    enabled: true
    threads: 10
    blind_xss: ""
  sqlmap:
    enabled: false               # aggressive; enable deliberately
    level: 1
    risk: 1
  crlfuzz:
    enabled: true
    concurrency: 25
  corsy:
    enabled: true
    threads: 20

# ------------------------------------------------------------------
# Phase 12 - Sensitive information / OSINT
# ------------------------------------------------------------------
sensitive_info:
  enabled: true
  github_dorking:
    enabled: true
    token: ""                    # falls back to GITHUB_TOKEN / github_recon.token
    dorks:
      - "password"
      - "secret"
      - "api_key"
      - "apikey"
      - "access_token"
      - "auth_token"
      - "credentials"
      - "db_password"
      - "ftp"
      - "ssh"
  google_dorking:
    enabled: true
    dorks:
      - "site:{target} ext:sql | ext:db | ext:log | ext:bak"
      - "site:{target} ext:xml | ext:conf | ext:env | ext:ini | ext:yml"
      - "site:{target} inurl:admin | inurl:login | inurl:dashboard"
      - "site:{target} intitle:\"index of\""
      - "site:{target} inurl:api | inurl:v1 | inurl:v2"
      - "site:{target} ext:php intitle:\"phpinfo()\""
  shodan:
    enabled: false
    api_key: ""                  # or export SHODAN_API_KEY
  s3scanner:
    enabled: false               # cloud_enum covers buckets without extra tooling

# ------------------------------------------------------------------
# Phase 13 - Screenshots
# ------------------------------------------------------------------
screenshots:
  enabled: true
  max_hosts: 100
  gowitness:
    enabled: true
    threads: 10
    timeout: 10
    resolution: "1440,900"
  aquatone:
    enabled: true
    threads: 5
    timeout: 15000

# ------------------------------------------------------------------
# Phase 14 - Prioritisation
# ------------------------------------------------------------------
finding_prioritizer:
  enabled: true
  min_severity: "info"           # info | low | medium | high | critical

# ------------------------------------------------------------------
# Phase 15 - Reporting
# ------------------------------------------------------------------
reporting:
  enabled: true
  html_report: true
  markdown_report: true
  sarif_export: true             # reports/results.sarif (GitHub code scanning / CI)
  track_history: true            # diff against the previous run for this target
  json_export: true
  csv_export: true

# ------------------------------------------------------------------
# Notifications (off by default - nothing leaves your machine)
# ------------------------------------------------------------------
notifications:
  enabled: false
  critical_only: true            # only push critical/high findings
  slack:
    enabled: false
    webhook_url: ""
  discord:
    enabled: false
    webhook_url: ""
  telegram:
    enabled: false
    bot_token: ""
    chat_id: ""
