[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synchunt"
version = "2.0.0"
description = "All-in-one automated recon and vulnerability-scanning framework (authorised testing only)"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
keywords = ["security", "recon", "vulnerability-scanner", "bug-bounty", "penetration-testing"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.28.0",
    "colorama>=0.4.6",
    "urllib3>=1.26.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pyflakes>=3.1"]
integrations = ["shodan>=1.28.0", "tldextract>=5.0"]

[project.scripts]
synchunt = "main:main"
synchunt-tools = "tools_cli:main"

[project.urls]
Homepage = "https://github.com/ziroai/synchunt"
Issues = "https://github.com/ziroai/synchunt/issues"

[tool.setuptools]
py-modules = ["main", "tools_cli"]

[tool.setuptools.packages.find]
include = ["core*", "modules*", "reports*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
